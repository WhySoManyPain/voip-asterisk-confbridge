[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0

[endpoint-tpl](!)
type=endpoint
context=internal
disallow=all
allow=ulaw
allow=alaw
direct_media=no
dtmf_mode=rfc4733

[auth-tpl](!)
type=auth
auth_type=userpass

[aor-tpl](!)
type=aor
max_contacts=1
remove_existing=yes

[1001](endpoint-tpl)
auth=auth1001
aors=1001
[1001](auth-tpl)
username=1001
password=voip1001
[1001](aor-tpl)

[1002](endpoint-tpl)
auth=auth1002  
aors=1002
[1002](auth-tpl)
username=1002
password=voip1002
[1002](aor-tpl)
