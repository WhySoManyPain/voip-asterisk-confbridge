[general]

[moje_konference]
type=bridge
; VARIANTA NAHRÁVÁNÍ: odkomentujte níže
; record_conference=yes
; record_file=/tmp/konference_nahravka.wav

[bezny_uzivatel]
type=user
; VARIANTA HUDBA PŘI ČEKÁNÍ (MoH): odkomentujte níže
; music_on_hold_when_empty=yes
; music_on_hold_class=default

[moje_menu]
type=menu
; VARIANTA DYNAMICKÉ MENU (DTMF): příklad akcí
*1=toggle_mute
*2=leave_conference
